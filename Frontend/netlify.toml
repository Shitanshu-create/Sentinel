[build]
  command = "npm run build"
  publish = "dist"

# Proxy all API requests to the Render backend to make them Same-Origin (first-party)
[[redirects]]
  from = "/api/*"
  to = "https://innerly-ai.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
